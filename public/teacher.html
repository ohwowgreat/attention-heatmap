<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attention Heatmap — Teacher</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #f0ede8;
    --muted: #7a7570;
    --accent: #e8d5a3;
    --c1: #ff6b6b;
    --c2: #4ecdc4;
    --c3: #ffe66d;
    --confirm: #6bcb77;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }

  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: var(--surface);
    border-bottom: 1px solid var(--border); gap: 16px; flex-wrap: wrap;
    transition: opacity .4s; z-index: 100; position: relative;
  }
  header.discussion-hidden { opacity: 0; pointer-events: none; height: 0; padding: 0; overflow: hidden; border: none; }

  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
  .logo span { color: var(--muted); }
  .role-badge {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
    background: rgba(232,213,163,.12); border: 1px solid rgba(232,213,163,.25); color: var(--accent);
  }

  .header-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid transparent; transition: all .18s;
    font-family: var(--sans); white-space: nowrap; background: none;
  }
  .pill-ghost { border-color: var(--border); color: var(--muted); }
  .pill-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .pill-accent { background: var(--accent); color: #111; font-weight: 600; }
  .pill-accent:hover { background: #f5e8c0; }
  .pill-danger { border-color: #5a2020; color: #e07070; }
  .pill-danger:hover { border-color: var(--c1); color: var(--c1); }
  .pill-confirm { border-color: #1e4a22; color: var(--confirm); }
  .pill-confirm:hover { border-color: var(--confirm); }
  .pill-active { background: var(--surface2); border-color: var(--accent); color: var(--accent); }

  .counter { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 6px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; }
  .counter strong { color: var(--text); font-size: 15px; }
  .counter .sync { font-size: 10px; color: var(--muted); margin-left: 4px; }

  #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 32px 24px; gap: 20px; }

  #upload-zone {
    width: 100%; max-width: 780px; border: 2px dashed var(--border); border-radius: 12px;
    padding: 64px 32px; text-align: center; cursor: pointer; transition: all .2s; background: var(--surface);
  }
  #upload-zone:hover, #upload-zone.drag-over { border-color: var(--accent); background: #1e1c17; }
  #upload-zone h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
  #upload-zone p { font-size: 14px; color: var(--muted); }
  #upload-zone .icon { font-size: 40px; margin-bottom: 16px; opacity: .6; }
  #file-input { display: none; }

  #canvas-wrapper {
    position: relative; display: none; border-radius: 8px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--border), 0 24px 60px rgba(0,0,0,.6);
    max-width: calc(100vw - 48px); max-height: calc(100vh - 200px); line-height: 0;
  }
  #canvas-wrapper img { display: block; max-width: 100%; max-height: calc(100vh - 200px); object-fit: contain; pointer-events: none; user-select: none; }
  #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

  #view-bar {
    display: none; width: 100%; max-width: 780px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px;
    gap: 8px; flex-wrap: wrap; align-items: center;
  }
  #view-bar.visible { display: flex; }
  #view-bar label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-family: var(--mono); margin-right: 4px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    font-size: 13px; padding: 10px 20px; border-radius: 8px; font-family: var(--mono);
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .tooltip-wrap { position: relative; display: inline-flex; }
  .tooltip-wrap .tooltip {
    position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
    background: #111; color: var(--text); font-size: 11px; padding: 4px 8px;
    border-radius: 4px; white-space: nowrap; pointer-events: none; opacity: 0;
    transition: opacity .15s; font-family: var(--mono); border: 1px solid var(--border);
  }
  .tooltip-wrap:hover .tooltip { opacity: 1; }

  body.discussion-mode #main { padding: 0; }
  body.discussion-mode #canvas-wrapper { max-width: 100vw; max-height: 100vh; border-radius: 0; box-shadow: none; }
  body.discussion-mode #canvas-wrapper img { max-height: 100vh; max-width: 100vw; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 680px) {
    .header-controls { gap: 6px; }
    .pill { padding: 6px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="app">

  <header id="header">
    <div class="logo-wrap">
      <div class="logo">Attention<span>/</span>Heatmap</div>
      <div class="role-badge">Teacher</div>
    </div>

    <div class="header-controls">
      <div class="counter" id="counter">
        <strong id="response-count">0</strong> responses
        <span class="sync" id="sync-indicator"></span>
      </div>

      <div id="view-bar">
        <label>View:</label>
        <button class="pill pill-ghost pill-active" id="btn-all" onclick="setView('all')">All</button>
        <button class="pill pill-ghost" id="btn-1" onclick="setView('1')">1st</button>
        <button class="pill pill-ghost" id="btn-2" onclick="setView('2')">2nd</button>
        <button class="pill pill-ghost" id="btn-3" onclick="setView('3')">3rd</button>
        <button class="pill pill-ghost" id="btn-heatmap" onclick="setView('heatmap')">Heatmap</button>
        <button class="pill pill-ghost" id="btn-avg" onclick="setView('avg')">Avg Zone</button>
      </div>

      <div id="loaded-controls" style="display:none;" class="header-controls">
        <div class="tooltip-wrap">
          <button class="pill pill-ghost" onclick="copyStudentLink()">⇗ Student Link</button>
          <span class="tooltip">Copy URL to share with students</span>
        </div>
        <div class="tooltip-wrap">
          <button class="pill pill-ghost" onclick="downloadCSV()">↓ CSV</button>
          <span class="tooltip">Export all click data</span>
        </div>
        <div class="tooltip-wrap">
          <button class="pill pill-confirm" onclick="toggleDiscussion()">Discussion</button>
          <span class="tooltip">Fullscreen projection mode</span>
        </div>
        <div class="tooltip-wrap">
          <button class="pill pill-ghost" onclick="document.getElementById('file-input').click()">New Image</button>
          <span class="tooltip">Upload a new image (clears data)</span>
        </div>
        <div class="tooltip-wrap">
          <button class="pill pill-danger" onclick="resetData()">Reset</button>
          <span class="tooltip">Clear student responses (keeps image)</span>
        </div>
      </div>

      <button class="pill pill-ghost" id="btn-exit-discussion" onclick="toggleDiscussion()" style="display:none;">✕ Exit Discussion</button>
    </div>
  </header>

  <div id="main">
    <div id="upload-zone"
      onclick="document.getElementById('file-input').click()"
      ondrop="handleDrop(event)"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')">
      <div class="icon">⊞</div>
      <h2>Upload an image to analyse</h2>
      <p>Click to browse or drag &amp; drop · PNG, JPG, GIF, WebP, SVG</p>
    </div>
    <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])">

    <div id="canvas-wrapper">
      <img id="main-img" src="" alt="Uploaded image">
      <canvas id="overlay-canvas"></canvas>
    </div>

    <div id="view-bar-placeholder"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let sessions = [];
let imageLoaded = false;
let view = 'all';
let discussionActive = false;
let pollInterval = null;

// ── INIT ──
async function init() {
  try {
    const res = await fetch('/api/image');
    const { src } = await res.json();
    if (src) {
      initImage(src);
    }
  } catch (e) {
    showToast('Could not reach server');
  }
}

// ── IMAGE ──
function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = async e => {
    const src = e.target.result;
    try {
      const res = await fetch('/api/image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ src }),
      });
      if (res.ok) {
        sessions = [];
        updateCounter();
        initImage(src);
        showToast('Image uploaded — student responses cleared');
      } else {
        showToast('Upload failed');
      }
    } catch (e) {
      showToast('Upload failed — check connection');
    }
  };
  reader.readAsDataURL(file);
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
}

function initImage(src) {
  const img = document.getElementById('main-img');
  img.src = src;
  img.onload = () => {
    document.getElementById('upload-zone').style.display = 'none';
    document.getElementById('canvas-wrapper').style.display = 'block';
    document.getElementById('loaded-controls').style.display = 'flex';
    document.getElementById('view-bar').classList.add('visible');
    imageLoaded = true;
    requestAnimationFrame(() => { resizeCanvas(); redraw(); });
    fetchSessions();
    startPolling();
  };
}

function resizeCanvas() {
  const img = document.getElementById('main-img');
  const canvas = document.getElementById('overlay-canvas');
  const w = img.offsetWidth, h = img.offsetHeight;
  if (!w || !h) return;
  canvas.width = w; canvas.height = h;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
}
window.addEventListener('resize', () => { if (imageLoaded) { resizeCanvas(); redraw(); } });

// ── POLLING ──
async function fetchSessions() {
  try {
    const res = await fetch('/api/sessions');
    const data = await res.json();
    const prev = sessions.length;
    sessions = data.sessions || [];
    updateCounter();
    if (sessions.length !== prev) redraw();
    document.getElementById('sync-indicator').textContent = 'live';
  } catch (e) {
    document.getElementById('sync-indicator').textContent = 'offline';
  }
}

function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(fetchSessions, 3000);
}

// ── COUNTER ──
function updateCounter() {
  document.getElementById('response-count').textContent = sessions.length;
}

// ── VIEW ──
function setView(v) {
  view = v;
  ['all','1','2','3','heatmap','avg'].forEach(id => {
    const btn = document.getElementById('btn-' + id);
    if (btn) btn.classList.toggle('pill-active', id === v);
  });
  redraw();
}

// ── DRAWING ──
function redraw() {
  if (!imageLoaded) return;
  const canvas = document.getElementById('overlay-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const colors = [null, '#ff6b6b', '#4ecdc4', '#ffe66d'];
  const getColor = order => colors[((order - 1) % 3) + 1];

  let points = [];
  sessions.forEach((session, si) => {
    session.clicks.forEach(c => {
      points.push({ nx: c.nx, ny: c.ny, order: c.order, session: si });
    });
  });

  if (view === 'heatmap') {
    drawHeatmap(ctx, W, H, points);
  } else if (view === 'avg') {
    drawAvgZones(ctx, W, H, points);
  } else {
    let filtered = view === 'all' ? points : points.filter(p => p.order === parseInt(view));
    filtered.forEach(p => {
      const x = p.nx * W, y = p.ny * H;
      const color = getColor(p.order);
      const grd = ctx.createRadialGradient(x, y, 0, x, y, 28);
      grd.addColorStop(0, color + '44'); grd.addColorStop(1, color + '00');
      ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI * 2);
      ctx.fillStyle = grd; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.fillStyle = color + '99'; ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px DM Mono, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.order, x, y);
    });
  }
}

function drawHeatmap(ctx, W, H, points) {
  const R = Math.min(W, H) * 0.08;
  const colorList = ['#ff6b6b', '#4ecdc4', '#ffe66d'];
  const getColor = order => colorList[(order - 1) % 3];

  // Draw glow blobs
  points.forEach(p => {
    if (view !== 'all' && p.order !== parseInt(view)) return;
    const x = p.nx * W, y = p.ny * H;
    const color = getColor(p.order);
    const grd = ctx.createRadialGradient(x, y, 0, x, y, R);
    grd.addColorStop(0, color + 'aa');
    grd.addColorStop(0.4, color + '44');
    grd.addColorStop(1, color + '00');
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fillStyle = grd; ctx.fill();
  });
  // Centre dots
  points.forEach(p => {
    if (view !== 'all' && p.order !== parseInt(view)) return;
    const x = p.nx * W, y = p.ny * H;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = getColor(p.order) + 'ee'; ctx.fill();
  });
}

function drawAvgZones(ctx, W, H, points) {
  const colorList = ['#ff6b6b', '#4ecdc4', '#ffe66d'];
  const getColor = order => colorList[(order - 1) % 3];
  const orders = [...new Set(points.map(p => p.order))];
  orders.forEach(ord => {
    const pts = points.filter(p => p.order === ord);
    if (!pts.length) return;
    const ax = pts.reduce((s, p) => s + p.nx, 0) / pts.length;
    const ay = pts.reduce((s, p) => s + p.ny, 0) / pts.length;
    const x = ax * W, y = ay * H;
    const R = Math.min(W, H) * 0.12;
    const color = getColor(ord);
    const grd = ctx.createRadialGradient(x, y, 0, x, y, R);
    grd.addColorStop(0, color + 'cc'); grd.addColorStop(0.5, color + '44'); grd.addColorStop(1, color + '00');
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fillStyle = grd; ctx.fill();
    ctx.fillStyle = color;
    ctx.font = 'bold 13px DM Mono, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('AVG ' + ord, x, y);
  });
}

// ── DISCUSSION MODE ──
function toggleDiscussion() {
  discussionActive = !discussionActive;
  document.body.classList.toggle('discussion-mode', discussionActive);
  document.getElementById('header').classList.toggle('discussion-hidden', discussionActive);
  document.getElementById('btn-exit-discussion').style.display = discussionActive ? 'flex' : 'none';
  document.getElementById('main').style.padding = discussionActive ? '0' : '';
  setTimeout(() => { resizeCanvas(); redraw(); }, 50);
}

// ── RESET ──
async function resetData() {
  if (!confirm('Clear all student responses? The image stays.')) return;
  try {
    await fetch('/api/sessions', { method: 'DELETE' });
    sessions = [];
    updateCounter();
    redraw();
    showToast('Responses cleared');
  } catch (e) {
    showToast('Reset failed — check connection');
  }
}

// ── CSV ──
function downloadCSV() {
  if (!sessions.length) { showToast('No data to export yet'); return; }
  const rows = [['StudentIndex', 'StudentName', 'ClickOrder', 'NormX', 'NormY', 'Reason']];
  sessions.forEach((s, si) => {
    s.clicks.forEach(c => {
      rows.push([
        si + 1,
        `"${(s.name || '').replace(/"/g, '""')}"`,
        c.order,
        c.nx.toFixed(4),
        c.ny.toFixed(4),
        `"${(s.reason || '').replace(/"/g, '""')}"`,
      ]);
    });
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'attention_heatmap_data.csv';
  a.click();
}

// ── COPY LINK ──
function copyStudentLink() {
  const url = window.location.origin + '/student.html';
  navigator.clipboard.writeText(url).then(() => showToast('Student link copied!'));
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
</body>
</html>
